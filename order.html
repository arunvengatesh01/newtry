<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order - Newtry Biscuits</title>
</head>

<body>

    <header>
        <h1>YOUR DETAILS</h1>
    </header>

    <main>

        <p>Product: Ragi Flour with Butter Biscuit</p>

        <form action="#" method="post">

            <p>
                <label for="name">Name:</label><br>
                <input id="name" name="name" type="text"
                       autocomplete="name" required>
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input id="email" name="email" type="email"
                       autocomplete="email" required>
            </p>

            <p>
                <label for="contact">Contact:</label><br>
                <input id="contact" name="contact" type="tel"
                       autocomplete="tel" required>
            </p>

            <p>
                <label for="address">Delivery address:</label><br>
                <textarea id="address" name="address"
                          rows="4" required></textarea>
            </p>

            <p>
                <label for="quantity">Quantity (packs):</label><br>
                <input id="quantity" name="quantity" type="number"
                       min="1" max="100" value="1" required>
            </p>

            <button type="submit">Submit</button>

        </form>

        <p>
            <strong>MAKE YOUR MOMENT BLOSSOM WITH NEWTRY</strong>
        </p>

        <p>
            <a href="products.html">Back to Products</a>
        </p>

    </main>

</body>
</html>
